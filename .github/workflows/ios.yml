name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: Kit unit tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
      - name: swift test
        run: swift test --package-path Packages/OhMyTranslateKit

  app:
    name: App + extension build and UI tests
    runs-on: macos-15
    timeout-minutes: 45
    # contents: write lets pushes to dev/* commit the gallery (see the last step).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and UI test
        run: scripts/ci-test.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn
      - name: Build unsigned IPA
        if: success()
        run: scripts/build-ipa.sh
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OhMyTranslate-unsigned-ipa
          path: build/OhMyTranslate-unsigned.ipa
      - name: Publish the screenshot gallery to docs/gallery
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev/')
        run: |
          rm -rf docs/gallery && mkdir -p docs/gallery
          cp screenshots/*.png docs/gallery/
          python3 scripts/write-gallery.py docs/gallery
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/gallery
          if git diff --cached --quiet; then echo "Gallery unchanged"; exit 0; fi
          git commit -m "Update app gallery screenshots [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload build log and test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/xcodebuild.log
            build/Result.xcresult
